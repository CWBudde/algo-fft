name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Unit with Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests

  test-asm:
    name: Test SIMD kernels (-tags asm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Note: `go vet -tags asm` is not run here — the .s files carry many
      # pre-existing asmdecl naming findings (functionally correct offsets
      # under mismatched parameter names). Tracked in PLAN.md P2.
      - name: Build with asm tag
        run: go build -tags asm -v ./...

      - name: Run tests with asm tag
        run: go test -tags asm -v -race -count=1 ./...
