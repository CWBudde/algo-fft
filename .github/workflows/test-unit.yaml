name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Unit with Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -count=1 -timeout=20m -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests

  # The default build (and the coverage job above) includes the SIMD kernels;
  # this job covers the pure-Go fallback so both configurations stay green.
  test-purego:
    name: Test pure-Go fallback (-tags purego)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (purego)
        run: go build -tags purego -v ./...

      - name: Run tests (purego)
        run: go test -tags purego -v -race -count=1 -timeout=20m ./...
