name: test-bench

# Benchmarks run nightly and on demand, not as a PR gate: shared runners are
# too noisy for a reliable regression threshold (see PLAN.md, Testing & CI
# Hardening). Results are uploaded as artifacts; the comparison against a
# committed baseline (benchmarks/baseline-<os>.txt) is informational until a
# baseline is committed.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: scripts/run_benchmarks.sh benchmarks/latest-${{ matrix.os }}.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare against baseline
        run: scripts/bench_compare.sh benchmarks/baseline-${{ matrix.os }}.txt benchmarks/latest-${{ matrix.os }}.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmarks
