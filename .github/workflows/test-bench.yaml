name: test-bench

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark Tests (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            mode: default
            tags: ""
          - os: ubuntu-latest
            mode: asm
            tags: asm
          - os: macos-14
            mode: default
            tags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        env:
          GO_TEST_TAGS: ${{ matrix.tags }}
          OUTPUT_PATH: benchmarks/latest-${{ matrix.os }}-${{ matrix.mode }}.txt
        run: |
          if [[ -n "$GO_TEST_TAGS" ]]; then
            scripts/run_benchmarks.sh "$OUTPUT_PATH" -tags "$GO_TEST_TAGS"
          else
            scripts/run_benchmarks.sh "$OUTPUT_PATH"
          fi

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare against baseline
        run: scripts/bench_compare.sh benchmarks/baseline-${{ matrix.os }}-${{ matrix.mode }}.txt benchmarks/latest-${{ matrix.os }}-${{ matrix.mode }}.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}-${{ matrix.mode }}
          path: benchmarks
