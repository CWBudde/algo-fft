name: Feature request
description: Suggest a new capability or API
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        Sketch the API or behavior you'd like. Check PLAN.md ("Post-v1.0
        Future") first — the item may already be on the roadmap.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried or other designs that could work.
    validations:
      required: false
